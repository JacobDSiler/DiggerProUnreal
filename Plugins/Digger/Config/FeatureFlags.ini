; ============================================================================
; Digger Plugin - Feature Flags (Closed Testing)
; ============================================================================
;
; Controls which features are visible in the Digger editor panel.
; Set a flag to true to enable, false to hide from testers.
;
; This file is loaded once per editor session by FDiggerFeatureFlags.
; Changes require an editor restart to take effect.
;
; ============================================================================

[/Script/DiggerEditor.FeatureFlags]

; --- Core Sculpting (ENABLED) ---
bEnableBrushTools=true
bEnableBrushShapes=true
bEnableCustomBrushes=false
bEnableEnvironment=true
bEnableNavigation=true
bEnableWorklight=true

; --- Sections (DISABLED for tester release) ---
bEnableIslands=false
bEnableMaterialManager=false
bEnableExportData=false
bEnableGenerationSection=false

; --- Not ready for testing ---
bEnableAdditionalTools=false
bEnableCaveImporter=false
bEnableDMM=false
bEnableBuild=false
bEnableDeveloperSettings=true          ; Troubleshooting for testers

; --- Brush Shapes (4 core + Debug only) ---
bEnableBrush_Sphere=true
bEnableBrush_Cube=true
bEnableBrush_Cylinder=false
bEnableBrush_Capsule=false
bEnableBrush_Cone=false
bEnableBrush_Torus=false
bEnableBrush_Pyramid=false
bEnableBrush_Icosphere=false
bEnableBrush_Smooth=true
bEnableBrush_Noise=true                ; Sharp brush
bEnableBrush_Light=false

; --- Disabled (unfinished or developer-only) ---
bEnableBrush_Stairs=false
bEnableBrush_Custom=false
bEnableBrush_Debug=true                ; Diagnostic use for testers
